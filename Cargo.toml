[package]
name = "tiger"
version = "0.3.17"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

build = "build.rs"
[features]
default = ["cuda"]
cuda = ["cuda-runtime-sys","rcudnn","rcudnn-sys","rcublas","rcublas-sys","nncombinator/cuda"]
[dependencies]
rand = "0.8.5"
rand_xorshift = "0.3.0"
statrs = "0.16.0"
rand_distr = "0.4.3"
rayon = "1.5.1"
libc = "0.2"
getopts = "0.2"
toml = "0.4"
serde = "1.0"
serde_derive = "1.0"
concurrent-queue = "1.2.4"
parking_lot = "0.12.2"
crossbeam-channel = "0.5.13"
cuda-runtime-sys = { version = "0.3.0-alpha.1", optional = true }
rcudnn = { version =  "1.8.0", optional = true }
rcudnn-sys = { version = "0.5.0", optional = true }
rcublas = { version = "0.6.0", optional = true }
rcublas-sys = { version = "0.5.0", optional = true }
[dependencies.nncombinator]
path = "../nncombinator"
default-features = false
[dependencies.packedsfen]
path = "../packedsfen"
[dependencies.usiagent]
path = "../USIAgent"
[dependencies.shogi_dataloader]
path = "../shogi_dataloader"
[build-dependencies]
cc = "1.0.73"
[profile.dev]
opt-level = 1

